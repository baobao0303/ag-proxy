name: Build & Push Docker

on:
  push:
    branches: [main]
    paths-ignore:
      - 'extension/**'
      - '*.md'
      - '.design-skills/**'
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version
        id: bump
        run: |
          git fetch --tags --force
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          LATEST_TAG=$(git tag -l "v[0-9]*" --sort=-v:refname | head -n 1 | sed 's/^v//')
          BASE_VERSION="$CURRENT_VERSION"
          if [ -n "$LATEST_TAG" ]; then
            BASE_VERSION=$(printf "%s\n%s\n" "$CURRENT_VERSION" "$LATEST_TAG" | sort -V | tail -n 1)
          fi
          IFS='.' read -r major minor patch <<< "$BASE_VERSION"
          NEW_VERSION="$major.$minor.$((patch + 1))"
          while git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; do
            patch=$((patch + 1))
            NEW_VERSION="$major.$minor.$patch"
          done
          npm version "$NEW_VERSION" --no-git-tag-version
          echo "VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$NEW_VERSION" >> "$GITHUB_ENV"
          echo "Current: $CURRENT_VERSION (Latest tag: $LATEST_TAG) -> New: $NEW_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Name
        run: |
          # GHCR requires repository names to be lowercase
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "Target Image: $IMAGE_NAME"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit version bump & push Git tag
        # The commit is marked [skip ci] so this push does not start another
        # run. git push uses the GITHUB_TOKEN, which is only granted by
        # `contents: write` above; if the repository has branch protection on
        # main the push is rejected, so it must not fail the whole build.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to v${{ env.VERSION }} [skip ci]" || true
          git tag -f "${{ env.TAG }}"
          git pull --rebase origin ${{ github.ref_name }} || true
          if ! git push origin ${{ github.ref_name }} || ! git push origin "${{ env.TAG }}" --force; then
            echo "::warning::could not push version bump/tag (branch protection?). The image and release were still published."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: AG Proxy ${{ env.TAG }}
          generate_release_notes: true

      - name: Notify Jenkins to deploy
        # `secrets` is not available in a step-level `if:` expression, so the
        # check is done in the shell instead. The step no-ops when the secret is
        # unset, which is the normal case for a fork or a fresh repository.
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          if [ -z "${JENKINS_URL:-}" ]; then
            echo "JENKINS_URL not set, skipping deploy notification"
            exit 0
          fi
          echo "Notifying Jenkins to deploy $IMAGE:$TAG"
          curl --fail --silent --show-error --max-time 30 \
            -u "$JENKINS_USER:$JENKINS_TOKEN" \
            -X POST "$JENKINS_URL/job/ag-proxy-deploy/buildWithParameters" \
            --data-urlencode "IMAGE_TAG=$TAG" \
            -o /dev/null
          echo "Jenkins notified"

