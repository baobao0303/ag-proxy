name: Build & Push Docker

on:
  push:
    branches: [main]
    paths-ignore:
      - 'extension/**'
      - '*.md'
      - '.design-skills/**'

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version
        id: bump
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          NEW_VERSION="$major.$minor.$((patch + 1))"
          npm version "$NEW_VERSION" --no-git-tag-version
          echo "VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$NEW_VERSION" >> "$GITHUB_ENV"
          echo "Current: $CURRENT_VERSION -> New: $NEW_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Name
        run: |
          # GHCR requires repository names to be lowercase
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "Target Image: $IMAGE_NAME"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit version bump & push Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump version to v${{ env.VERSION }} [skip ci]" || true
          git tag "${{ env.TAG }}"
          git push origin main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: AG Proxy ${{ env.TAG }}
          generate_release_notes: true

      - name: Notify Jenkins (Optional)
        if: env.JENKINS_WEBHOOK_URL != ''
        env:
          JENKINS_WEBHOOK_URL: ${{ secrets.JENKINS_WEBHOOK_URL }}
        run: |
          echo "Notifying Jenkins about new version ${{ env.TAG }}..."
          curl -X POST "$JENKINS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${{ env.IMAGE_NAME }}\",\"tag\":\"${{ env.TAG }}\",\"version\":\"${{ env.VERSION }}\"}" || true

