services:
  ag-proxy:
    image: ghcr.io/baobao0303/ag-proxy:${IMAGE_TAG:-latest}
    container_name: ag-proxy
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
